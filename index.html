<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Model Viewer</title>
  <style>
    :root {
      /* Thumbnail container adjustments */
      --thumbnail-top: 18%;
      --thumbnail-left: 12%;
      --thumbnail-width: 28%;
      --thumbnail-height: 29%;
      --thumbnail-object-fit: cover;
      --thumbnail-object-position: center top;

      /* D-pad adjustments */
      --dpad-bottom: 21%;
      --dpad-width: 6%;
      --dpad-height: 10%;
      --dpad-left-position: 16%;
      --dpad-right-position: 22%;
    }

    html, body { height: 100%; margin: 0; overflow: hidden; position: relative; background-color: #111; background-image: url('pokemonBackground.gif'); background-size: cover; background-position: center; background-repeat: no-repeat; }
    #ui {
      position: fixed; left: 12px; top: 12px; z-index: 10;
      color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: rgba(0,0,0,0.55); padding: 10px 12px; border-radius: 10px;
      backdrop-filter: blur(6px);
      max-width: calc(100vw - 24px);
    }
    #ui h1 { font-size: 14px; margin: 0 0 6px 0; font-weight: 600; }
    #ui .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
    #ui button {
      border: 0; border-radius: 8px; padding: 8px 10px;
      background: #2b2b2b; color: #fff; cursor: pointer;
    }
    #ui button:hover { background: #3a3a3a; }
    #ui button:disabled { background: #1a1a1a; color: #666; cursor: not-allowed; }
    #ui label { font-size: 12px; opacity: 0.9; display: flex; gap: 6px; align-items: center; }
    #ui input[type="range"] { width: 140px; }
    #modelCounter { font-size: 12px; opacity: 0.8; }
    #msg {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #ddd; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 2; }

    /* Pokedex Menu Styles */
    #menuButton { position: fixed; top: 12px; right: 12px; z-index: 11; width: 100px; cursor: pointer; transition: transform 0.2s; }
    #menuButton:hover { transform: scale(1.1); }
    #pokedex-open {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 12;
      display: none; justify-content: center; align-items: center;
    }
    .pokedex-wrapper {
      position: relative;
      max-width: 90%;
      width: 600px;
    }
    #pokedex-open-img { width: 100%; pointer-events: none; }
    #thumbnail-container {
      position: absolute; top: var(--thumbnail-top); left: var(--thumbnail-left); width: var(--thumbnail-width); height: var(--thumbnail-height);
      overflow: hidden; pointer-events: none; border-radius: 4px; z-index: 25;
    }
    #thumbnail {
      width: 100%; height: 100%; object-fit: var(--thumbnail-object-fit); object-position: var(--thumbnail-object-position);
    }
    .dpad-left, .dpad-right {
      position: absolute; bottom: var(--dpad-bottom); width: var(--dpad-width); height: var(--dpad-height);
      cursor: pointer; z-index: 30;
    }
    .dpad-left { left: var(--dpad-left-position); }
    .dpad-right { left: var(--dpad-right-position); }
  </style>
</head>
<body>
  <div id="ui">
    <h1>3D Model Viewer</h1>
    <div class="row">
      <span id="modelCounter">Model 1 of 1</span>
    </div>
    <div class="row">
      <button id="reset">Reset View</button>
      <button id="toggleRotate">Auto-rotate: OFF</button>
      <button id="toggleModel">Hide Model</button>
      <label>Speed <input id="speed" type="range" min="0" max="2" step="0.01" value="0.6"></label>
    </div>
  </div>

  <img id="menuButton" src="models/thumbnails/pokedex.png" alt="Menu">
  <div id="pokedex-open">
    <div class="pokedex-wrapper">
      <img id="pokedex-open-img" src="models/thumbnails/pokedex_open.png" alt="Open Pokedex">
      <div id="thumbnail-container">
        <img id="thumbnail" src="" alt="Model Thumbnail">
      </div>
      <div class="dpad-left"></div>
      <div class="dpad-right"></div>
    </div>
  </div>
  <div id="msg">Loading models…</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    let MODEL_FILES = [];
    let currentModelIndex = 0;
    let currentSound = null; 
    let showModel = true;

    const msg = document.getElementById("msg");
    const pokedexOpen = document.getElementById("pokedex-open");
    const thumbnail = document.getElementById("thumbnail");
    const menuButton = document.getElementById("menuButton");
    const dpadLeft = document.querySelector(".dpad-left");
    const dpadRight = document.querySelector(".dpad-right");

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 2000);
    camera.position.set(2.5, 1.7, 2.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const textureLoader = new THREE.TextureLoader();

    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let rotation = { x: 0.3, y: 0.8 };
    let targetRotation = { x: 0.3, y: 0.8 };
    let cameraRadius = 5;
    let cameraTarget = new THREE.Vector3(0, 0, 0);

    // Mouse Controls
    renderer.domElement.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
    renderer.domElement.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;
        targetRotation.y += deltaX * 0.005;
        targetRotation.x += deltaY * 0.005;
        targetRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotation.x));
        previousMousePosition = { x: e.clientX, y: e.clientY };
      }
    });
    renderer.domElement.addEventListener('mouseup', (e) => { isDragging = false; handleClick(e); });
    renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); cameraRadius += e.deltaY * 0.01; cameraRadius = Math.max(0.5, Math.min(100, cameraRadius)); });

    // Touch Controls
    let initialPinchDistance = 0;
    let startTouchPosition = { x: 0, y: 0 };
    renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: false });
    renderer.domElement.addEventListener('touchmove', onTouchMove, { passive: false });
    renderer.domElement.addEventListener('touchend', onTouchEnd, { passive: false });

    function onTouchStart(event) {
      if (event.touches.length === 1) {
        isDragging = true;
        const touch = event.touches[0];
        previousMousePosition.x = touch.clientX;
        previousMousePosition.y = touch.clientY;
        startTouchPosition.x = touch.clientX;
        startTouchPosition.y = touch.clientY;
      } else if (event.touches.length === 2) {
        isDragging = false;
        const dx = event.touches[0].clientX - event.touches[1].clientX;
        const dy = event.touches[0].clientY - event.touches[1].clientY;
        initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
      }
      event.preventDefault();
    }

    function onTouchMove(event) {
      if (event.touches.length === 1 && isDragging) {
        const touch = event.touches[0];
        const deltaX = touch.clientX - previousMousePosition.x;
        const deltaY = touch.clientY - previousMousePosition.y;
        targetRotation.y += deltaX * 0.005;
        targetRotation.x += deltaY * 0.005;
        targetRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotation.x));
        previousMousePosition.x = touch.clientX;
        previousMousePosition.y = touch.clientY;
      } else if (event.touches.length === 2) {
        const dx = event.touches[0].clientX - event.touches[1].clientX;
        const dy = event.touches[0].clientY - event.touches[1].clientY;
        const currentDistance = Math.sqrt(dx * dx + dy * dy);
        const delta = initialPinchDistance - currentDistance;
        cameraRadius += delta * 0.05;
        cameraRadius = Math.max(0.5, Math.min(100, cameraRadius));
        initialPinchDistance = currentDistance;
      }
      event.preventDefault();
    }

    function onTouchEnd(event) {
      if (event.touches.length === 0) {
        isDragging = false;
      }
      if (event.changedTouches.length === 1) {
        const touch = event.changedTouches[0];
        const deltaMove = Math.sqrt(
          (touch.clientX - startTouchPosition.x) ** 2 + (touch.clientY - startTouchPosition.y) ** 2
        );
        if (deltaMove < 10) { // Treat as tap if small movement
          handleClick(touch);
        }
      }
      event.preventDefault();
    }

    function updateCamera() {
      rotation.x += (targetRotation.x - rotation.x) * 0.1;
      rotation.y += (targetRotation.y - rotation.y) * 0.1;
      camera.position.x = cameraTarget.x + cameraRadius * Math.cos(rotation.x) * Math.sin(rotation.y);
      camera.position.y = cameraTarget.y + cameraRadius * Math.sin(rotation.x);
      camera.position.z = cameraTarget.z + cameraRadius * Math.cos(rotation.x) * Math.cos(rotation.y);
      camera.lookAt(cameraTarget);
    }

    const hemi = new THREE.HemisphereLight(0xffffff, 0x222233, 1.0);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(3, 6, 4);
    scene.add(dir);

    const loader = new THREE.GLTFLoader();
    let pivot = null;

    async function loadModel(filename) {
      msg.style.display = 'grid';
      msg.textContent = 'Loading model…';
      if (pivot) { scene.remove(pivot); pivot = null; }
      try {
        const gltf = await loader.loadAsync(filename);
        const modelRoot = gltf.scene;
        const box = new THREE.Box3().setFromObject(modelRoot);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        modelRoot.position.x = -center.x;
        modelRoot.position.y = -center.y;
        modelRoot.position.z = -center.z;
        pivot = new THREE.Group();
        pivot.add(modelRoot);
        scene.add(pivot);
        cameraRadius = Math.max(size.x, size.y, size.z) * 2.5;
        loadSound(filename);
        msg.style.display = "none";
        updateModelCounter();
      } catch (err) { msg.textContent = `Failed to load ${filename}.`; }
    }

    async function loadCard(filename) {
      msg.style.display = 'grid';
      msg.textContent = 'Loading card…';
      if (pivot) { scene.remove(pivot); pivot = null; }

      const frontUrl = getThumbnailUrl(filename);
      const backUrl = 'models/thumbnails/cardbacking.png';

      try {
        const [frontTexture, backTexture] = await Promise.all([
          textureLoader.loadAsync(frontUrl),
          textureLoader.loadAsync(backUrl)
        ]);

        const aspect = frontTexture.image.width / frontTexture.image.height;
        const cardWidth = 1;
        const cardHeight = cardWidth / aspect;

        const matOptions = { side: THREE.FrontSide, transparent: true, alphaTest: 0.5 };
        
        const frontGeometry = new THREE.PlaneGeometry(cardWidth, cardHeight);
        const frontMaterial = new THREE.MeshBasicMaterial({ map: frontTexture, ...matOptions });
        const frontMesh = new THREE.Mesh(frontGeometry, frontMaterial);

        const backGeometry = new THREE.PlaneGeometry(cardWidth, cardHeight);
        const backMaterial = new THREE.MeshBasicMaterial({ map: backTexture, ...matOptions });
        const backMesh = new THREE.Mesh(backGeometry, backMaterial);
        backMesh.rotation.y = Math.PI;

        pivot = new THREE.Group();
        pivot.add(frontMesh);
        pivot.add(backMesh);
        scene.add(pivot);

        cameraRadius = Math.max(cardWidth, cardHeight) * 2.5;
        if (currentSound) { currentSound.pause(); currentSound = null; }
        msg.style.display = "none";
        updateModelCounter();
      } catch (err) { msg.textContent = `Failed to load card: ${err.message}`; console.error(err); }
    }

    async function loadCurrent() {
      const filename = MODEL_FILES[currentModelIndex];
      showModel ? await loadModel(filename) : await loadCard(filename);
      updateThumbnail();
    }

    function loadSound(modelFilename) {
      if (currentSound) { currentSound.pause(); currentSound = null; }
      const baseName = modelFilename.split('/').pop().replace('.glb', '');
      currentSound = new Audio(`sounds/${baseName}.mp3`);
      currentSound.preload = 'auto';
    }

    function playSound() { if (currentSound) { currentSound.currentTime = 0; currentSound.play().catch(err => {}); } }

    function handleClick(event) {
      if (!showModel) return;
      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
      pointer.y = - (event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);
      if (intersects.length > 0 && intersects[0].object.isMesh) playSound();
    }

    function updateModelCounter() {
      document.getElementById('modelCounter').textContent =
        `${getDisplayName(MODEL_FILES[currentModelIndex])} (${currentModelIndex + 1} of ${MODEL_FILES.length})`;
    }

    function getDisplayName(filename) {
      return filename.split('/').pop().replace('.glb', '').replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    function getThumbnailUrl(glbFilename) {
      return `models/thumbnails/${glbFilename.split('/').pop().replace('.glb', '')}.jpg`;
    }

    async function init() {
      try {
        const response = await fetch('https://api.github.com/repos/pneumatic-steel/3D-viewer/contents/models');
        const data = await response.json();
        MODEL_FILES = data
          .filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.glb'))
          .map(item => `models/${item.name}`)
          .sort((a, b) => a.localeCompare(b));
        await loadCurrent();
      } catch (error) { msg.textContent = 'Failed to fetch model list.'; }
    }

    function updateThumbnail() {
      thumbnail.src = getThumbnailUrl(MODEL_FILES[currentModelIndex]);
    }

    window.switchModel = function(direction) {
      currentModelIndex = (currentModelIndex + direction + MODEL_FILES.length) % MODEL_FILES.length;
      loadCurrent();
    };

    menuButton.onclick = () => {
      const isOpen = pokedexOpen.style.display === 'flex';
      pokedexOpen.style.display = isOpen ? 'none' : 'flex';
      if (!isOpen) updateThumbnail();
    };

    // Close on click outside or background
    pokedexOpen.addEventListener('click', () => { pokedexOpen.style.display = 'none'; });

    // Prevent close when clicking D-pad
    dpadLeft.addEventListener('click', (e) => { e.stopPropagation(); switchModel(-1); });
    dpadRight.addEventListener('click', (e) => { e.stopPropagation(); switchModel(1); });

    let autoRotate = false;
    const btnRotate = document.getElementById("toggleRotate");
    const speed = document.getElementById("speed");

    btnRotate.onclick = () => { autoRotate = !autoRotate; btnRotate.textContent = `Auto-rotate: ${autoRotate ? "ON" : "OFF"}`; };
    document.getElementById("reset").onclick = () => { targetRotation = { x: 0.3, y: 0.8 }; rotation = { x: 0.3, y: 0.8 }; };
    document.getElementById("toggleModel").onclick = () => { showModel = !showModel; document.getElementById("toggleModel").textContent = showModel ? "Hide Model" : "Show Model"; loadCurrent(); };

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      updateCamera();
      if (pivot && autoRotate && !isDragging) pivot.rotation.y += clock.getDelta() * parseFloat(speed.value);
      renderer.render(scene, camera);
    }
    animate();

    window.onresize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
    init();
  </script>
</body>
</html>
