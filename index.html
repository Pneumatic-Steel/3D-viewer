<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex-Themed 3D Model Viewer</title>
    <style>
        body {
            margin: 0;
            background: #000;
            font-family: Arial, sans-serif;
            color: #fff;
            overflow: hidden;
        }
        #viewer {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #222;
        }
        #menu-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px; /* fairly small but visible */
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s;
        }
        #menu-button:hover {
            transform: scale(1.1);
        }
        #pokedex-open {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            width: 600px;
            display: none;
            z-index: 20;
        }
        #pokedex-open-img {
            width: 100%;
            pointer-events: none; /* allows clicks to pass through the image itself */
        }
        #thumbnail-container {
            position: absolute;
            top: 15.5%;     /* aligned to the left screen area */
            left: 12.5%;
            width: 200px;
            height: 200px;
            overflow: hidden;
            pointer-events: none;
            border-radius: 8px;
        }
        #thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top; /* focuses on the Pokémon artwork */
        }
        /* D-pad clickable areas (invisible) */
        .dpad-left, .dpad-right {
            position: absolute;
            bottom: 21%;
            width: 50px;
            height: 60px;
            cursor: pointer;
            z-index: 30;
            pointer-events: all; /* enable clicks */
        }
        .dpad-left  { left: 17%; }
        .dpad-right { left: 25%; }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="viewer">
        <!-- Your 3D viewer canvas goes here (Three.js, etc.) -->
        <div style="text-align:center; font-size:20px;">
            3D Model Viewer<br>
            <span id="model-info">Model 1 of X</span>
        </div>

        <!-- Closed Pokédex - menu button (upper right) -->
        <img id="menu-button" src="thumbnails/pokedex.png" alt="Menu">

        <!-- Open Pokédex - overlay -->
        <div id="pokedex-open">
            <img id="pokedex-open-img" src="thumbnails/pokedex_open.png" alt="Open Pokedex">
        </div>

        <!-- Thumbnail cropped into left screen -->
        <div id="thumbnail-container">
            <img id="thumbnail" src="" alt="Model Thumbnail">
        </div>

        <!-- D-pad left/right clickable zones -->
        <div class="dpad-left"  onclick="switchModel(-1)"></div>
        <div class="dpad-right" onclick="switchModel(1)"></div>
    </div>

    <div id="controls">
        Reset View | Auto-rotate: OFF | Hide Model | Speed
    </div>

    <script>
        // List all your card thumbnails here (add as many as you have)
        const models = [
            { thumbnail: 'thumbnails/venusaur.png' },     // replace with your actual filenames
            { thumbnail: 'thumbnails/charizard.png' },
            { thumbnail: 'thumbnails/blastoise.png' },
            // add more...
        ];

        let currentModel = 0;

        const menuButton       = document.getElementById('menu-button');
        const pokedexOpen      = document.getElementById('pokedex-open');
        const thumbnailCont    = document.getElementById('thumbnail-container');
        const thumbnailImg     = document.getElementById('thumbnail');
        const modelInfo        = document.getElementById('model-info');

        // Toggle menu open/close
        menuButton.addEventListener('click', () => {
            const isOpen = pokedexOpen.style.display === 'block';
            pokedexOpen.style.display = isOpen ? 'none' : 'block';
            thumbnailCont.style.display = isOpen ? 'none' : 'block';

            if (!isOpen) {
                updateThumbnail();
            }
        });

        // Switch models
        window.switchModel = (direction) => {
            currentModel = (currentModel + direction + models.length) % models.length;
            updateThumbnail();

            // UPDATE YOUR 3D MODEL LOADER HERE
            console.log(`Load 3D model for index ${currentModel}`);
            // Example: loadModel(models[currentModel].gltfPath);

            modelInfo.textContent = `Model ${currentModel + 1} of ${models.length}`;
        };

        function updateThumbnail() {
            thumbnailImg.src = models[currentModel].thumbnail;
        }

        // Optional: load first thumbnail on start if you want
        // updateThumbnail();
    </script>
</body>
</html>
